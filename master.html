<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Projects | JP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Instrument Serif', 'serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        premium: {
                            dark: '#050505',
                            charcoal: '#0b0b0c',
                            accent: '#00579f',
                            border: 'rgba(255, 255, 255, 0.08)',
                            glass: 'rgba(255, 255, 255, 0.02)'
                        }
                    },
                    letterSpacing: {
                        'premium-tight': '-0.05em',
                        'premium-wide': '0.5em',
                    },
                    animation: {
                        'slow-rotate': 'slow-rotate 15s linear infinite',
                        'reveal': 'reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        'slow-rotate': { 'from': { transform: 'rotate(45deg)' }, 'to': { transform: 'rotate(405deg)' } },
                        'reveal': {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="index.css">
</head>

<body class="selection:bg-premium-accent selection:text-black bg-premium-dark">
    <div class="noise-overlay"></div>
    <div class="grainy-bg"></div>

    <canvas id="particle-canvas" class="fixed inset-0 pointer-events-none z-[3000] opacity-40"></canvas>

    <!-- Header -->
    <header id="main-header"
        class="fixed top-6 md:top-8 left-1/2 -translate-x-1/2 w-[calc(100%-32px)] md:w-[calc(100%-80px)] lg:w-[calc(100%-120px)] max-w-7xl z-[1000] flex justify-between items-center px-6 md:px-10 rounded-full h-16 md:h-20 backdrop-blur-md border border-premium-border bg-white/5 reveal active">
        <a href="index.html" class="flex items-center gap-4 md:gap-6 group cursor-pointer">
            <div class="relative w-10 h-10 flex items-center justify-center">
                <div id="logo-box"
                    class="absolute inset-0 rotate-45 rounded-lg border border-white/40 transition-all duration-500 animate-slow-rotate">
                </div>
                <span id="logo-initials"
                    class="header-text relative z-10 text-[11px] font-bold tracking-tighter transition-colors duration-500">JP</span>
            </div>
            <div class="flex flex-col">
                <span
                    class="header-text text-[13px] font-bold tracking-[0.3em] uppercase transition-colors duration-500 leading-none">JP
                    BURITICÁ</span>
                <span
                    class="header-text text-[8px] tracking-[0.2em] uppercase font-medium mt-1.5 transition-colors duration-500 text-premium-accent">Software Engineer</span>
            </div>
        </a>

        <button id="menu-toggle"
            class="flex items-center gap-3 md:gap-4 px-6 md:px-8 py-2.5 md:py-3 rounded-full border border-premium-border bg-white/5 hover:bg-white/10 transition-all duration-500 group">
            <span class="text-[10px] uppercase tracking-[0.3em] font-bold">Menu</span>
            <i data-lucide="menu" class="w-4 h-4 transition-transform group-hover:rotate-12"></i>
        </button>

        <!-- Menu Dropdown -->
        <div id="dropdown-menu"
            class="absolute top-full right-0 mt-6 w-72 backdrop-blur-xl bg-premium-charcoal/90 border border-premium-border rounded-[2rem] overflow-hidden opacity-0 scale-95 pointer-events-none origin-top-right shadow-2xl">
            <div class="p-6 space-y-1">
                <a href="index.html#about"
                    class="menu-link group flex items-center justify-between px-6 py-5 rounded-2xl transition-all text-[11px] font-bold tracking-[0.2em] uppercase hover:bg-white/5">
                    <span class="group-hover:translate-x-2 transition-all">Experience</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-all"></i>
                </a>
                <a href="index.html#contact-section"
                    class="menu-link group flex items-center justify-between px-6 py-5 rounded-2xl transition-all text-[11px] font-bold tracking-[0.2em] uppercase hover:bg-white/5">
                    <span class="group-hover:translate-x-2 transition-all">Contact</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-all"></i>
                </a>
                <a href="master.html"
                    class="menu-link group flex items-center justify-between px-6 py-5 rounded-2xl transition-all text-[11px] font-bold tracking-[0.2em] uppercase hover:bg-white/5">
                    <span class="group-hover:translate-x-2 transition-all text-premium-accent">Projects</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-all"></i>
                </a>
            </div>
        </div>
    </header>

    <main class="pt-32 md:pt-48 lg:pt-64 px-4 md:px-6 min-h-screen relative z-10 pb-24 md:pb-32">
        <div class="container mx-auto max-w-6xl reveal-on-scroll active">
            <div class="space-y-6 mb-16 md:mb-24">
                <span class="text-[11px] uppercase tracking-widest-premium font-bold text-white/30 font-display">Portfolio Archive</span>
                <h1 class="text-6xl md:text-8xl lg:text-9xl font-normal tracking-premium leading-[0.8] mb-4">
                    MASTER <span class="font-serif italic text-premium-accent">PROJECTS</span>
                </h1>
                <div class="w-24 h-px bg-premium-accent/40"></div>
            </div>

            <div class="grid lg:grid-cols-2 gap-12" id="projects-container">
                <!-- Projects will be injected here via JS -->
            </div>
        </div>
    </main>

    <!-- Social Section -->
    <footer class="bg-white text-premium-dark py-32 px-6">
        <div class="container mx-auto max-w-6xl">
            <div class="flex flex-col items-center gap-16">
                <h2 class="text-4xl font-serif italic text-center">Let's build something exceptional.</h2>
                <div
                    class="bg-premium-charcoal/5 backdrop-blur-xl border border-premium-dark/10 px-12 py-10 rounded-full flex flex-wrap items-center justify-center gap-16 shadow-2xl hover:shadow-premium-dark/10 transition-all duration-700">
                    <a href="https://www.linkedin.com/in/juanburitica/" target="_blank" rel="noopener noreferrer"
                        class="group flex items-center gap-4 text-premium-dark/60 hover:text-premium-dark transition-all">
                        <div class="p-3 rounded-full bg-premium-dark/5 group-hover:bg-premium-dark group-hover:text-white transition-all duration-500">
                            <i data-lucide="linkedin" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
                        </div>
                        <span class="text-[10px] uppercase tracking-[0.2em] font-bold">LinkedIn</span>
                    </a>
                    <div class="w-px h-8 bg-premium-dark/10 hidden md:block"></div>
                    <a href="https://github.com/JuanBuritica" target="_blank" rel="noopener noreferrer"
                        class="group flex items-center gap-4 text-premium-dark/60 hover:text-premium-dark transition-all">
                        <div class="p-3 rounded-full bg-premium-dark/5 group-hover:bg-premium-dark group-hover:text-white transition-all duration-500">
                            <i data-lucide="github" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
                        </div>
                        <span class="text-[10px] uppercase tracking-[0.2em] font-bold">GitHub</span>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // DATA - USER CAN EDIT THIS LIST
        const PROJECTS = [
            {
                name: "Body Index Calculator",
                description: "A web-based tool to calculate BMI, body fat percentage, and BMR with a modern interface and health tracking features.",
                link: "https://juanburitica.github.io/calculadora-indices/"
            },
            {
                name: "Maze Generator",
                description: "An interactive Q-Learning maze generator with pathfinding visualization using reinforcement learning principles.",
                link: "https://juanburitica.github.io/Q-Learning/"
            }
        ];

        const initProjects = () => {
            const container = document.getElementById('projects-container');
            if (!container) return;

            PROJECTS.forEach((proj, idx) => {
                const card = document.createElement('a');
                card.href = proj.link;
                card.target = "_blank";
                card.className = "group relative p-8 md:p-16 rounded-[2.5rem] md:rounded-[3rem] border border-white/5 bg-white/2 hover:bg-white/5 hover:border-premium-accent/30 hover:scale-[1.02] transition-all duration-700 block overflow-hidden shadow-2xl reveal-on-scroll";

                card.innerHTML = `
                    <div class="absolute top-0 right-0 p-8 md:p-12 opacity-0 group-hover:opacity-100 transition-all duration-700 translate-x-4 group-hover:translate-x-0">
                        <i data-lucide="arrow-up-right" class="w-8 h-8 md:w-10 md:h-10 text-premium-accent"></i>
                    </div>
                    <div class="space-y-6 md:space-y-8 relative z-10">
                        <span class="text-[10px] font-bold text-white/20 uppercase tracking-widest-premium font-display">Project 0${idx + 1}</span>
                        <h3 class="text-3xl md:text-4xl lg:text-5xl font-normal tracking-premium group-hover:text-premium-accent transition-all duration-500 font-serif italic lowercase text-white">${proj.name}</h3>
                        <p class="text-white/50 text-base md:text-lg font-light leading-relaxed group-hover:text-white/80 transition-all duration-500 max-w-sm font-display">
                            ${proj.description}
                        </p>
                        <div class="pt-8 flex items-center gap-4">
                            <span class="text-[11px] uppercase tracking-widest-premium font-bold text-white/40 group-hover:text-premium-accent transition-all duration-500 font-display">View Process</span>
                            <div class="h-px w-12 bg-white/10 group-hover:bg-premium-accent/50 transition-all duration-500"></div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
            
            // Re-run observer for injected projects
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal-on-scroll').forEach(el => observer.observe(el));
        };

        const initMenu = () => {
            const menuBtn = document.getElementById('menu-toggle');
            const dropdown = document.getElementById('dropdown-menu');

            const closeMenu = () => {
                dropdown.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
                dropdown.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
            };

            const openMenu = () => {
                dropdown.classList.add('opacity-100', 'scale-100', 'pointer-events-auto');
                dropdown.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
            };

            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = dropdown.classList.contains('opacity-100');
                if (isOpen) closeMenu(); else openMenu();
            });

            document.addEventListener('click', closeMenu);
        };

        const initParticles = () => {
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            let w = canvas.width = window.innerWidth;
            let h = canvas.height = window.innerHeight;
            const particles = [];
            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.2,
                    vy: (Math.random() - 0.5) * 0.2,
                    size: Math.random() * 1.5
                });
            }

            function draw() {
                ctx.clearRect(0, 0, w, h);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
            window.addEventListener('resize', () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; });
            
            window.addEventListener('scroll', () => {
                const footer = document.querySelector('footer.bg-white');
                const header = document.getElementById('main-header');
                const menuBtn = document.getElementById('menu-toggle');
                const logoBox = document.getElementById('logo-box');
                const logoInitials = document.getElementById('logo-initials');
                if(!footer || !header) return;
                
                const rect = footer.getBoundingClientRect();
                const isOverWhite = rect.top <= 100 && rect.bottom > 0;

                if (isOverWhite) {
                    header.classList.add('bg-premium-dark/80', 'border-white/10');
                    header.classList.remove('bg-white/5', 'border-premium-border');
                    header.style.color = '#fff';
                    if(logoBox) logoBox.style.borderColor = '#00b2e3';
                    if(logoInitials) logoInitials.style.color = '#00b2e3';
                    menuBtn.classList.add('bg-white/10', 'border-white/20');
                } else {
                    header.classList.add('bg-white/5', 'border-premium-border');
                    header.classList.remove('bg-premium-dark/80', 'border-white/10');
                    header.style.color = '#fff';
                    if(logoBox) logoBox.style.borderColor = 'rgba(255, 255, 255, 0.4)';
                    if(logoInitials) logoInitials.style.color = '#fff';
                    menuBtn.classList.add('bg-white/5', 'border-premium-border');
                    menuBtn.classList.remove('bg-white/10', 'border-white/20');
                }
            });
        };

        window.addEventListener('DOMContentLoaded', () => {
            initParticles();
            initProjects();
            initMenu();
        });
    </script>
</body>

</html>>
