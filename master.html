<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Projects | JP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        premium: {
                            dark: '#121212',
                            charcoal: '#181A1D',
                            accent: '#506C83',
                            border: 'rgba(255, 255, 255, 0.1)',
                            glass: 'rgba(255, 255, 255, 0.03)'
                        }
                    },
                    letterSpacing: {
                        'premium-tight': '-0.04em',
                        'premium-wide': '0.4em',
                    },
                    animation: {
                        'slow-rotate': 'slow-rotate 12s linear infinite',
                        'reveal': 'reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        'slow-rotate': { 'from': { transform: 'rotate(45deg)' }, 'to': { transform: 'rotate(405deg)' } },
                        'reveal': {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="index.css">
</head>

<body class="selection:bg-white selection:text-black bg-premium-dark">
    <canvas id="particle-canvas" class="fixed inset-0 pointer-events-none z-[3000]"></canvas>

    <!-- Header -->
    <header id="main-header"
        class="fixed top-8 left-1/2 -translate-x-1/2 w-[calc(100%-40px)] lg:w-[calc(100%-120px)] max-w-7xl z-[1000] flex justify-between items-center px-10 rounded-full h-20 backdrop-blur-md border border-premium-border bg-white/5 reveal active">
        <a href="index.html" class="flex items-center gap-6 group cursor-pointer">
            <div class="relative w-10 h-10 flex items-center justify-center">
                <div id="logo-box"
                    class="absolute inset-0 rotate-45 rounded-lg border border-white/40 transition-all duration-500 animate-slow-rotate">
                </div>
                <span id="logo-initials"
                    class="header-text relative z-10 text-[11px] font-bold tracking-tighter transition-colors duration-500">JP</span>
            </div>
            <div class="flex flex-col">
                <span
                    class="header-text text-[13px] font-bold tracking-[0.3em] uppercase transition-colors duration-500 leading-none">JP
                    BURITICÁ</span>
                <span
                    class="header-text text-[8px] tracking-[0.2em] uppercase font-medium mt-1.5 transition-colors duration-500 opacity-40">SOFTWARE
                    ENGINEER</span>
            </div>
        </a>

        <button id="menu-toggle"
            class="flex items-center gap-4 px-8 py-3 rounded-full border border-premium-border bg-white/5 hover:bg-white/10 transition-all duration-500 group">
            <span class="text-[10px] uppercase tracking-[0.3em] font-bold">Menu</span>
            <i data-lucide="menu" class="w-4 h-4 transition-transform group-hover:rotate-12"></i>
        </button>

        <!-- Menu Dropdown -->
        <div id="dropdown-menu"
            class="absolute top-full right-0 mt-6 w-72 backdrop-blur-xl bg-premium-charcoal/90 border border-premium-border rounded-[2rem] overflow-hidden opacity-0 scale-95 pointer-events-none origin-top-right shadow-2xl">
            <div class="p-6 space-y-1">
                <a href="index.html#about"
                    class="menu-link group flex items-center justify-between px-6 py-5 rounded-2xl transition-all text-[11px] font-bold tracking-[0.2em] uppercase hover:bg-white/5">
                    <span class="group-hover:translate-x-2 transition-all">Experience</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-all"></i>
                </a>
                <a href="index.html#contact-section"
                    class="menu-link group flex items-center justify-between px-6 py-5 rounded-2xl transition-all text-[11px] font-bold tracking-[0.2em] uppercase hover:bg-white/5">
                    <span class="group-hover:translate-x-2 transition-all">Contact</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-all"></i>
                </a>
                <a href="master.html"
                    class="menu-link group flex items-center justify-between px-6 py-5 rounded-2xl transition-all text-[11px] font-bold tracking-[0.2em] uppercase hover:bg-white/5">
                    <span class="group-hover:translate-x-2 transition-all">Projects</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-all"></i>
                </a>
            </div>
        </div>
    </header>

    <main class="pt-64 px-6 min-h-screen relative z-10">
        <div class="container mx-auto max-w-6xl reveal-on-scroll active">
            <div class="space-y-4 mb-24">
                <span class="text-[10px] uppercase tracking-premium-wide font-bold text-white/40">Portfolio Archive</span>
                <h1 class="text-7xl font-light uppercase tracking-premium-tight">
                    MASTER <span class="font-serif italic text-white/60">PROJECTS</span>
                </h1>
            </div>

            <div class="grid lg:grid-cols-2 gap-12" id="projects-container">
                <!-- Projects will be injected here via JS -->
            </div>
        </div>
    </main>

    <!-- Social Section -->
    <section class="bg-white text-premium-dark py-32 px-6">
        <div class="container mx-auto max-w-6xl">
            <div class="flex justify-center">
                <div
                    class="bg-premium-charcoal/5 backdrop-blur-xl border border-premium-dark/10 px-12 py-10 rounded-[2.5rem] flex flex-wrap items-center justify-center gap-16 shadow-2xl hover:shadow-premium-dark/10 transition-all duration-700">
                    <a href="https://www.linkedin.com/in/juanburitica/" target="_blank" rel="noopener noreferrer"
                        class="group flex items-center gap-4 text-premium-dark/60 hover:text-premium-dark transition-all">
                        <div class="p-3 rounded-full bg-premium-dark/5 group-hover:bg-premium-dark group-hover:text-white transition-all duration-500">
                            <i data-lucide="linkedin" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
                        </div>
                        <span class="text-[10px] uppercase tracking-[0.2em] font-bold">LinkedIn</span>
                    </a>
                    <div class="w-px h-8 bg-premium-dark/10 hidden md:block"></div>
                    <a href="https://github.com/JuanBuritica" target="_blank" rel="noopener noreferrer"
                        class="group flex items-center gap-4 text-premium-dark/60 hover:text-premium-dark transition-all">
                        <div class="p-3 rounded-full bg-premium-dark/5 group-hover:bg-premium-dark group-hover:text-white transition-all duration-500">
                            <i data-lucide="github" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
                        </div>
                        <span class="text-[10px] uppercase tracking-[0.2em] font-bold">GitHub</span>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <script>
        // DATA - USER CAN EDIT THIS LIST
        const PROJECTS = [
            {
                name: "Body Index Calculator",
                description: "A web-based tool to calculate BMI, body fat percentage, and BMR with a modern interface.",
                link: "https://juanburitica.github.io/calculadora-indices/"
            },
            {
                name: "Maze Generator",
                description: "An interactive Q-Learning maze generator with pathfinding visualization.",
                link: "https://juanburitica.github.io/Q-Learning/"
            },
            // Add your projects here...
        ];

        const initProjects = () => {
            const container = document.getElementById('projects-container');
            if (!container) return;

            PROJECTS.forEach(proj => {
                const card = document.createElement('a');
                card.href = proj.link;
                card.target = "_blank";
                card.className = "group relative p-12 rounded-[2.5rem] border border-white/5 bg-white/5 hover:bg-white/10 hover:border-white/20 hover:scale-[1.02] transition-all duration-700 block overflow-hidden shadow-2xl reveal-on-scroll";

                card.innerHTML = `
                    <div class="absolute top-0 right-0 p-10 opacity-0 group-hover:opacity-100 transition-all duration-700 translate-x-4 group-hover:translate-x-0">
                        <i data-lucide="arrow-up-right" class="w-8 h-8 text-white/60"></i>
                    </div>
                    <div class="space-y-6 relative z-10">
                        <h3 class="text-4xl font-light uppercase tracking-premium-tight group-hover:text-premium-accent transition-all duration-500">${proj.name}</h3>
                        <p class="text-white/40 font-light leading-relaxed group-hover:text-white/70 transition-all duration-500 max-w-sm">
                            ${proj.description}
                        </p>
                        <div class="pt-6 flex items-center gap-3">
                            <span class="text-[9px] uppercase tracking-premium-wide font-bold border-b border-white/10 pb-2 group-hover:border-white transition-all duration-500 px-1">Explore Project</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
            
            // Re-run observer for injected projects
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal-on-scroll').forEach(el => observer.observe(el));
        };

        const initMenu = () => {
            const menuBtn = document.getElementById('menu-toggle');
            const dropdown = document.getElementById('dropdown-menu');

            const closeMenu = () => {
                dropdown.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
                dropdown.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
            };

            const openMenu = () => {
                dropdown.classList.add('opacity-100', 'scale-100', 'pointer-events-auto');
                dropdown.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
            };

            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = dropdown.classList.contains('opacity-100');
                if (isOpen) closeMenu(); else openMenu();
            });

            document.addEventListener('click', closeMenu);
        };

        let particleColor = 'rgba(255,255,255,0.6)';

        const initParticles = () => {
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            let w = canvas.width = window.innerWidth;
            let h = canvas.height = window.innerHeight;
            const particles = [];
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    size: Math.random() * 2
                });
            }

            function draw() {
                ctx.clearRect(0, 0, w, h);
                ctx.fillStyle = particleColor;
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
            window.addEventListener('resize', () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; });
            
            // For master.html, we check scroll against the footer
            window.addEventListener('scroll', () => {
                const footer = document.querySelector('section.bg-white');
                const header = document.getElementById('main-header');
                const menuBtn = document.getElementById('menu-toggle');
                const logoBox = document.getElementById('logo-box');
                const logoInitials = document.getElementById('logo-initials');
                if(!footer || !header) return;
                
                const rect = footer.getBoundingClientRect();
                // Only turn black if footer is truly at the top and visible
                const isOverWhite = rect.top <= 100 && rect.bottom > 0;

                if (isOverWhite) {
                    // LIGHT SECTION THEME -> Header becomes DARK GLASS
                    header.classList.remove('bg-white/80', 'border-black/10');
                    header.classList.add('bg-premium-dark/70', 'border-white/20', 'backdrop-blur-xl');
                    header.style.color = '#fff';
                    
                    if(logoBox) logoBox.style.borderColor = 'rgba(255, 255, 255, 0.4)';
                    if(logoInitials) logoInitials.style.color = '#fff';
                    document.querySelectorAll('.header-text').forEach(t => t.style.color = '#fff');

                    menuBtn.classList.remove('bg-black/5', 'border-black/10');
                    menuBtn.classList.add('bg-white/10', 'border-white/20');
                    menuBtn.style.color = '#fff';
                    
                    particleColor = 'rgba(0,0,0,0.4)';
                } else {
                    // DARK SECTION THEME -> Header becomes WHITE GLASS
                    header.classList.remove('bg-premium-dark/70', 'bg-premium-dark/80', 'border-white/20');
                    header.classList.add('bg-white/70', 'border-black/10', 'backdrop-blur-xl');
                    header.style.color = '#000';
                    
                    if(logoBox) logoBox.style.borderColor = 'rgba(0, 0, 0, 0.4)';
                    if(logoInitials) logoInitials.style.color = '#000';
                    document.querySelectorAll('.header-text').forEach(t => t.style.color = '#000');

                    menuBtn.classList.remove('bg-white/10', 'border-white/20');
                    menuBtn.classList.add('bg-black/5', 'border-black/10');
                    menuBtn.style.color = '#000';
                    
                    particleColor = 'rgba(255,255,255,0.6)';
                }
            });
        };

        window.addEventListener('DOMContentLoaded', () => {
            initParticles();
            initProjects();
            initMenu();
        });
    </script>
</body>

</html>
